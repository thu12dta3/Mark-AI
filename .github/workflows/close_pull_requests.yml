# GitHub Pull Request Workflow Restriction
# External Pull Requests are not accepted in this repository.

name: Disable Pull Requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  close_pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Close Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Thank you for your interest! In accordance with the governance model of the Mark-AI research initiative, external Pull Requests are disabled and not accepted for this repository. If you have questions, feedback, or found an issue, please open an Issue instead."
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: "closed"
            });
